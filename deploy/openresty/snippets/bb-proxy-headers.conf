# bb-proxy-headers.conf — header gửi sang app Next (127.0.0.1:3000). Include trong MỌI location có proxy_pass:
# nginx không kế thừa proxy_set_header từ location khác (contracts/lead-b2b.md mục 3.8, lỗi #2).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;                       # ghi đè giá trị client tự gửi; app CHỈ đọc header này
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
# Header bảo mật do openresty gửi (bb-security-headers.conf) → bỏ bản của app để không bị lặp
proxy_hide_header X-Powered-By;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
