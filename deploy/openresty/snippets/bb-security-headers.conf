# bb-security-headers.conf — header bảo mật cho MỌI phản hồi của lapdattoanquoc.vn (NFR-SEC-03).
# nginx KHÔNG kế thừa add_header từ server{} vào location có add_header riêng → include lại file này trong mọi location
# có add_header (lapdattoanquoc.conf đã làm). X-Frame-Options, Permissions-Policy do app (next.config.ts) gửi.
#
# HSTS nâng dần (docs/04 mục 2.7): 300 (ngày launch) → 86400 (sau 1 tuần) → 31536000 (sau 1 tháng ổn định,
# khi chắc www/subdomain đều https). Sửa số ở đây rồi `openresty -t && openresty -s reload`.
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
