# =============================================================================================================
# lapdattoanquoc.vn — openresty (nginx) — TỆP SINH TỰ ĐỘNG, KHÔNG SỬA TAY
# Nguồn: content/redirects.ts → node scripts/gen-openresty-map.mjs (kiểm: --check). Mẫu: docs/04 mục 2.7.
# Include TRONG khối http{}. Trước khi áp: `openresty -V` (nginx ≥ 1.25.1 mới hiểu "http2 on;", bản cũ hơn chạy lại
# script với --legacy-http2), `openresty -t`, rồi `openresty -s reload`. Sau khi áp: scripts/check-redirects.mjs.
# Cần thêm: deploy/openresty/snippets/*.conf → /etc/openresty/snippets/ (đường dẫn include bên dưới), chứng chỉ có SAN www.
# =============================================================================================================

# Khóa map dài (≤ 53 ký tự) → tăng bucket (nếu nginx.conf chính đã đặt directive này thì xóa dòng dưới)
map_hash_bucket_size 128;

# --- Chuẩn hóa "/" cuối trước khi tra bảng: /news/ và /en/intro/ cũng chỉ 1 hop --------------------------------
map $uri $bb_norm {
    ~^(?<bb_p>.+?)/+$ $bb_p;
    default $uri;
}

# --- URL cũ → mới (35 dòng: 28 trang từ sitemap cũ + 7 ảnh og:image) ---
map $bb_norm $bb_new_uri {
    default "";
    /intro                                                 /ve-chung-toi;
    /services                                              /dich-vu;
    /prices                                                /bang-gia;
    /news                                                  /kien-thuc;
    /requirement                                           /doi-tac-tho;
    /worker-map                                            /doi-tac-tho;
    /system-map                                            /mang-luoi;
    /contact                                               /lien-he;
    /news/lap-dat-may-lanh-dung-cach-7-buoc                /kien-thuc/lap-dat-may-lanh-dung-cach-7-buoc;
    /news/10-nguyen-nhan-may-lanh-khong-lanh               /kien-thuc/10-nguyen-nhan-may-lanh-khong-lanh;
    /news/rui-ro-lap-dat-may-giat-khong-dung-cach          /kien-thuc/rui-ro-lap-dat-may-giat-khong-dung-cach;
    /news/chuyen-doi-so-trong-lap-dat-toan-quoc            /kien-thuc/chuyen-doi-so-trong-lap-dat-toan-quoc;
    /news/tuong-lai-nganh-dien-lanh-2026                   /kien-thuc/tuong-lai-nganh-dien-lanh-2026;
    /news/robot-va-tu-dong-hoa-gia-dinh                    /kien-thuc/robot-tu-dong-hoa-xu-huong-gia-dinh-hien-dai;
    /news/robot-tu-dong-hoa-xu-huong-gia-dinh-hien-dai     /kien-thuc/robot-tu-dong-hoa-xu-huong-gia-dinh-hien-dai;
    /en/intro                                              /en/about;
    /en/prices                                             /en/pricing;
    /en/news                                               /en/knowledge;
    /en/requirement                                        /en/technician-partners;
    /en/worker-map                                         /en/technician-partners;
    /en/system-map                                         /en/network;
    /en/news/lap-dat-may-lanh-dung-cach-7-buoc             /en/knowledge/how-to-install-an-air-conditioner-in-7-steps;
    /en/news/10-nguyen-nhan-may-lanh-khong-lanh            /en/knowledge/10-reasons-your-air-conditioner-is-not-cooling;
    /en/news/rui-ro-lap-dat-may-giat-khong-dung-cach       /en/knowledge/risks-of-improper-washing-machine-installation;
    /en/news/chuyen-doi-so-trong-lap-dat-toan-quoc         /en/knowledge/digital-transformation-in-nationwide-installation;
    /en/news/tuong-lai-nganh-dien-lanh-2026                /en/knowledge/hvac-industry-outlook-2026;
    /en/news/robot-va-tu-dong-hoa-gia-dinh                 /en/knowledge/home-robots-and-automation-trends;
    /en/news/robot-tu-dong-hoa-xu-huong-gia-dinh-hien-dai  /en/knowledge/home-robots-and-automation-trends;
    /images/og-cover.jpg                                   /images/og/bluebolt-services-vi-v3.jpg;
    /images/news/lap-dat-may-lanh-7-buoc.jpg               /images/og/bluebolt-services-vi-v3.jpg;
    /images/news/nguyen-nhan-may-lanh-hero.png             /images/news/nguyen-nhan-may-lanh.png;
    /images/news/robot-gia-dinh.jpg                        /images/news/og/robot-tu-dong-hoa-xu-huong-gia-dinh-hien-dai.jpg;
    /images/news/em-telco-tect-image-web-1024x690.jpg      /images/news/og/robot-tu-dong-hoa-xu-huong-gia-dinh-hien-dai.jpg;
    /images/khang-3d-poster.webp                           /images/og/bluebolt-services-vi-v3.jpg;
    /images/vn-map-workers.svg                             /data/vn34-map.svg;
}

# --- 410 Gone (3 dòng: bài AI VI/EN — giả định Q10, chờ anh Duy — và ảnh đã gỡ) ------------------------
map $bb_norm $bb_gone {
    default 0;
    /news/ky-nguyen-ai-nhung-nganh-bi-anh-huong            1;
    /en/news/ky-nguyen-ai-nhung-nganh-bi-anh-huong         1;
    /images/news-card10.jpg                                1;
}

# --- Đích cuối cho http→https / www→apex: URL cũ thì về URL mới, còn lại giữ đường dẫn đã bỏ "/" cuối ----------
map $bb_new_uri $bb_dest {
    "" $bb_norm;
    default $bb_new_uri;
}

# --- Đường dẫn (khác "/") kết thúc bằng "/" → 301 về bản không "/" (AC-R-4) --------------------------------------
map $uri $bb_trailing_slash {
    ~^/.+/$ 1;
    default 0;
}

# --- Ngôn ngữ của trang 410 ------------------------------------------------------------------------------------
map $bb_norm $bb_gone_lang {
    ~^/en(/|$) en;
    default vi;
}

# --- Rate limit form lead (contracts/lead-b2b.md 3.8): lớp THÔ ở openresty; giới hạn chính xác 5 lần/10 phút ở app.
#     rate=5r/10m KHÔNG hợp lệ (limit_req_zone chỉ nhận số nguyên r/s hoặc r/m) → 1r/m + burst 4 = 5 request dồn ngay.
limit_req_zone $binary_remote_addr zone=bb_leads:1m rate=1r/m;

upstream bb_web {
    server 127.0.0.1:3000;   # Next standalone (Docker) — chỉ loopback, không mở cổng ra Internet
    keepalive 16;
}

# --- :80 → https apex, 1 hop, áp luôn bảng URL cũ ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lapdattoanquoc.vn www.lapdattoanquoc.vn;
    server_tokens off;

    error_page 410 @bb_gone;
    if ($bb_gone) { return 410; }
    return 301 https://lapdattoanquoc.vn$bb_dest$is_args$args;

    location @bb_gone {
        default_type text/html;
        charset utf-8;
        add_header X-Robots-Tag "noindex" always;
        if ($bb_gone_lang = en) { return 410 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>410 — Page removed</title></head><body style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#0F172A"><h1>This page has been removed</h1><p>This content is no longer available on lapdattoanquoc.vn.</p><p><a href="/en" style="color:#004AAD">Go to the Bluebolt Services home page</a></p></body></html>'; }
        return 410 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>410 — Trang đã được gỡ</title></head><body style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#0F172A"><h1>Trang này đã được gỡ</h1><p>Nội dung không còn trên lapdattoanquoc.vn.</p><p><a href="/" style="color:#004AAD">Về trang chủ Bluebolt Services</a></p></body></html>';
    }
}

# --- www → apex (hiện trả 502). Cần chứng chỉ có SAN www -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lapdattoanquoc.vn;
    server_tokens off;
    ssl_certificate     /etc/ssl/lapdattoanquoc.vn/fullchain.pem;
    ssl_certificate_key /etc/ssl/lapdattoanquoc.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/bb-security-headers.conf;

    error_page 410 @bb_gone;
    if ($bb_gone) { return 410; }
    return 301 https://lapdattoanquoc.vn$bb_dest$is_args$args;

    location @bb_gone {
        default_type text/html;
        charset utf-8;
        include snippets/bb-security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        if ($bb_gone_lang = en) { return 410 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>410 — Page removed</title></head><body style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#0F172A"><h1>This page has been removed</h1><p>This content is no longer available on lapdattoanquoc.vn.</p><p><a href="/en" style="color:#004AAD">Go to the Bluebolt Services home page</a></p></body></html>'; }
        return 410 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>410 — Trang đã được gỡ</title></head><body style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#0F172A"><h1>Trang này đã được gỡ</h1><p>Nội dung không còn trên lapdattoanquoc.vn.</p><p><a href="/" style="color:#004AAD">Về trang chủ Bluebolt Services</a></p></body></html>';
    }
}

# --- apex: site chính ---------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lapdattoanquoc.vn;
    server_tokens off;
    ssl_certificate     /etc/ssl/lapdattoanquoc.vn/fullchain.pem;
    ssl_certificate_key /etc/ssl/lapdattoanquoc.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS nâng dần: 300 → 86400 (sau 1 tuần) → 31536000 (sau 1 tháng, khi chắc www/subdomain đều https) — trong snippet
    include snippets/bb-security-headers.conf;
    proxy_hide_header X-Powered-By;

    error_page 410 @bb_gone;
    if ($bb_gone)                { return 410; }
    if ($bb_new_uri != "")       { return 301 https://lapdattoanquoc.vn$bb_new_uri$is_args$args; }
    if ($bb_trailing_slash)      { return 301 https://lapdattoanquoc.vn$bb_norm$is_args$args; }

    location @bb_gone {
        default_type text/html;
        charset utf-8;
        include snippets/bb-security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        if ($bb_gone_lang = en) { return 410 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>410 — Page removed</title></head><body style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#0F172A"><h1>This page has been removed</h1><p>This content is no longer available on lapdattoanquoc.vn.</p><p><a href="/en" style="color:#004AAD">Go to the Bluebolt Services home page</a></p></body></html>'; }
        return 410 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>410 — Trang đã được gỡ</title></head><body style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#0F172A"><h1>Trang này đã được gỡ</h1><p>Nội dung không còn trên lapdattoanquoc.vn.</p><p><a href="/" style="color:#004AAD">Về trang chủ Bluebolt Services</a></p></body></html>';
    }

    location /_next/static/ {                     # KHÔNG đặt expires: Next tự trả "immutable"
        include snippets/bb-proxy-headers.conf;
        proxy_pass http://bb_web;
    }

    location /film/ {                             # GLB, KTX2, video, poster (tên có hash)
        include snippets/bb-proxy-headers.conf;
        proxy_pass http://bb_web;
        include snippets/bb-security-headers.conf; # bắt buộc: location có add_header riêng không kế thừa từ server
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Form lead — chỉ có tác dụng khi /api/v1/leads được build (contracts/lead-b2b.md phải APPROVED trước)
    location = /api/v1/leads {
        limit_req zone=bb_leads burst=4 nodelay;
        limit_req_status 429;                     # mặc định nginx trả 503
        client_max_body_size 16k;
        error_page 429 = @leads_429;
        error_page 413 = @leads_413;
        include snippets/bb-proxy-headers.conf;   # X-Real-IP = $remote_addr: app CHỈ đọc header này (sửa lỗi 3.8 #2)
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_pass http://bb_web;
    }
    location @leads_429 {
        default_type application/json;
        include snippets/bb-security-headers.conf;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Too many requests","details":[]}}';
    }
    location @leads_413 {
        default_type application/json;
        include snippets/bb-security-headers.conf;
        return 413 '{"success":false,"error":{"code":"PAYLOAD_TOO_LARGE","message":"Payload too large","details":[]}}';
    }

    location / {
        include snippets/bb-proxy-headers.conf;
        proxy_pass http://bb_web;
    }
}
